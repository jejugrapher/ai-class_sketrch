<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Sketch Stage — Projector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; height:100%; background:#03132b; overflow:hidden; font-family:-apple-system, "Apple SD Gothic Neo", sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
          background:rgba(0,10,30,.82); color:#fff; cursor:pointer; }
  #gate h1 { font-size:44px; margin:0; }
  #gate p { font-size:20px; opacity:.85; margin:0; }
  #gate.off { display:none; }
  #dev { position:fixed; left:12px; bottom:12px; display:none; flex-wrap:wrap; gap:6px; background:rgba(0,0,0,.55); padding:8px; border-radius:10px; }
  #dev.on { display:flex; }
  #dev button { background:#1f6feb; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; }
  #qr { position:fixed; inset:0; display:none; align-items:center; justify-content:center; gap:48px; background:linear-gradient(#0b3d91,#03132b); color:#fff; z-index:4; }
  #qr.on { display:flex; }
  #qr img { width:min(52vh, 480px); height:auto; background:#fff; padding:18px; border-radius:18px; }
  #qr .txt h1 { font-size:54px; margin:0 0 14px; } #qr .txt p { font-size:26px; margin:6px 0; opacity:.92; } #qr .txt .u { font-size:22px; opacity:.7; font-family:monospace; margin-top:18px; }
  #tag { position:fixed; right:14px; top:10px; color:rgba(255,255,255,.55); font-size:14px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag"></div>
<div id="gate"><h1>스케치 무대</h1><p>화면을 한 번 누르면 시작합니다 (소리 켜짐)</p></div>
<div id="qr"><img src="../assets/qr_kid.png" alt="아이 화면 QR"><div class="txt"><h1>스케치 무대</h1><p>① 폰 카메라로 QR을 찍어요</p><p>② 자리 번호와 별명을 정해요</p><p>③ 그림을 그려서 무대로 보내요</p><div class="u">jejugrapher.github.io/ai-class_sketrch/kid/</div></div></div>
<div id="dev">
  <button data-w="sea">바다</button><button data-w="village">마을</button><button data-w="night">마법의 밤</button><button data-w="forest">숲</button>
  <button id="dFriend">친구</button><button id="dSsireum">씨름</button><button id="dDance">춤</button>
  <button id="dDemo">예시</button><button id="dRig">도안 예시</button><button id="dWorld">아이배경 예시</button><button id="dClear">비우기</button>
</div>
<script src="../stage_engine.js"></script>
<script src="../stage_demos.js"></script>
<script src="../stage_guides.js"></script>
<script src="../stage_bus.js"></script>
<script src="../stage_server.js"></script>
<script src="../stage_rt.js"></script>
<script>
var tag = document.getElementById('tag');
var E = new StageEngine({ canvas: document.getElementById('c'), soundBase: '../assets/sound/',
  onCount: function (n) { tag.textContent = (E.custom[E.world()] ? E.custom[E.world()].name : E.worlds[E.world()].name) + ' · ' + n + '개'; },
  onWorld: function (w) { tag.textContent = (E.custom[w] ? E.custom[w].name : E.worlds[w].name) + ' · ' + E.sprites().length + '개'; } });
tag.textContent = '제주 바다 · 0개';

/* 첫 터치: 소리 허용 + 전체화면 */
var gate = document.getElementById('gate');
var qr = document.getElementById('qr');
gate.onclick = function () { E.sound.enable(); gate.classList.add('off'); qr.classList.add('on'); if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); };
qr.onclick = function () { qr.classList.remove('on'); };                     // 프로젝터에서 직접 눌러도 닫힘
document.addEventListener('keydown', function (e) { if (e.key === 'q' || e.key === 'Q') qr.classList.toggle('on'); });   // Q 키로 토글

/* 이미지 데이터 → 스프라이트 (흰 배경 오려내기 포함) */
function addFromData(msg) {
  var im = new Image();
  im.onload = function () { var cut = msg.transparent ? toCanvas(im) : E.cutout(im, 512); if (cut) { E.add(cut, msg); StageRT.watch(msg.id); } };
  im.src = msg.dataUrl || msg.url;
}
function toCanvas(im) { var c = document.createElement('canvas'); c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0); return c; }

/* 도안 예시 (강사 [예시 넣기]) */
function addRigSamples() {
    var cols = ['#f4a261', '#2a9d8f', '#e76f51', '#8ecae6', '#ffb703', '#cdb4db', '#90be6d'];
    var cats = { whale: 'whale', oarfish: 'fish', crab: 'crawler', clam: 'clam', squid: 'fish', octopus: 'crawler', haenyeo: 'person', person: 'person', bird: 'bird', raft: 'boat', sailboat: 'boat', car: 'vehicle', airplane: 'aircraft', paperplane: 'light', submarine: 'sub' };
    var KO = { whale: '참고래', oarfish: '산갈치', crab: '게', clam: '조개', squid: '오징어', octopus: '문어', haenyeo: '해녀', person: '사람', bird: '새', raft: '뗏목', sailboat: '돛단배', car: '자동차', airplane: '비행기', paperplane: '종이비행기', submarine: '잠수함' };
    StageGuides.names.forEach(function (n, i) { var smp = StageGuides.sample(n, cols[i % cols.length]); if (smp) { E.add(smp.canvas, { id: 'demo_' + n, seat: 0, nick: KO[n] || n, cat: cats[n] || 'fish', rig: smp.rig, rigBox: smp.rigBox, demo: true }); } });
}

/* 강사 명령 받기 */
StageBus.on(function (m) {
  switch (m.type) {
    case 'world':  E.setWorld(m.name); break;
    case 'mission': if (m.name === 'stop') E.missionStop(); else { E.setWorld(m.name === 'sea' ? 'sea' : 'forest'); setTimeout(function () { E.missionStart(m.name); }, 1500); } break;
    case 'scene':  ({ friends: E.friends, tournament: E.tournament, dance: E.dance, end: E.endScene }[m.name] || function(){})(); break;
    case 'auto':   E.setAuto(m.on); break;
    case 'clear':  E.clear(); break;
    case 'demo':   addRigSamples(); break;
    case 'sprite': addFromData(m); break;
    case 'remove': E.removeSprite(m.id); StageRT.unwatch(m.id); break;
    case 'defineWorld': (function () { var im = new Image(); im.onload = function () { E.defineWorld(m.id, { name: m.name, kind: m.kind, band: m.band, desc: m.desc, img: im }); if (m.show) E.setWorld(m.id); }; im.src = m.dataUrl || m.url; })(); break;
    case 'sound':  if (m.on) E.sound.enable(); else E.sound.on = false; break;
    case 'qr':     qr.classList.toggle('on', m.toggle ? !qr.classList.contains('on') : !!m.on); break;
    case 'ping':   StageBus.send({ type: 'status', count: E.sprites().length, world: E.world() }); break;
  }
});
setInterval(function () { StageBus.send({ type: 'status', count: E.sprites().length, world: E.world() }); }, 3000);
/* 아이 조종·채팅 */
StageRT.onCtrl(function (id, dx, dy, act) { if (act === 'grab') { E.grab(id); return; } E.control(id, +dx || 0, +dy || 0); });
StageRT.onChat(function (id, text) { E.chat(id, text); });
StageRT.init('stage').then(function (mode) {
  rtMode = mode; if (mode !== 'firebase') return;
  setInterval(function () { StageRT.publishPos(E.positions()); }, 500);               // 위치 공유 (가까운 친구 판단)
  StageRT.onReq(function (r) {
    if (r.type === 'friend') E.friendsById(r.from, r.to);                             // 친구하기는 바로 효과
    if (r.type === 'ssireum') { var t = E.find(r.to); if (t && t.demo) startDemoDuel(r.from, r.to); }   // 예시 캐릭터는 수락 없이 바로
  });
  /* 예시 캐릭터와의 씨름: 프로젝터가 대결을 만들고 예시 캐릭터 몫의 연타도 넣는다 */
  function startDemoDuel(kidId, demoId) {
    if (E.sceneName() === 'duel') return;
    var key = StageRT.createMatch({ a: kidId, b: demoId, status: 'go', score: {} }); if (!key) return;
    var t = setInterval(function () { StageRT.tap(key, demoId, Math.random() < 0.5 ? 2 : 1); }, 450 + Math.random()*250);   // 초당 2~3점
    setTimeout(function () { clearInterval(t); }, 12000);
  }
  /* 예시 캐릭터가 아이 말에 반응한다 */
  var REPLY = [
    [/안녕/, function (d, me) { return '안녕! 난 ' + (d.nick || '친구') + '야'; }],
    [/여기 있어/, function (d, me) { E.control(d.id, me.x > d.x ? 1 : -1, 0); return '찾았다! 거기 있었구나'; }],
    [/같이 놀자/, function (d, me) { E.friendsById(me.id, d.id); return '좋아, 같이 놀자!'; }],
    [/씨름/, function (d, me) { startDemoDuel(me.id, d.id); return '덤벼 봐!'; }],
    [/춤/, function (d, me) { E.dash(d.id, 3); return '🎵 같이 춤추자!'; }],
    [/빨라/, function (d, me) { E.dash(d.id, 5); return '나도 엄청 빨라!'; }],
    [/배고파/, function (d, me) { return '나도 배고파… 냠냠'; }],
    [/으악|깜짝/, function (d, me) { E.flee(d.id, me.id); return '깜짝이야!!'; }]
  ];
  StageRT.onChat(function (id, text) {
    var me = E.find(id), d = E.nearestDemo(id, 0.4); if (!me || !d) return;
    for (var i = 0; i < REPLY.length; i++) if (REPLY[i][0].test(text)) { var r = REPLY[i][1](d, me); setTimeout(function () { E.chat(d.id, r); }, 900); return; }
    setTimeout(function () { E.chat(d.id, ['응?', '그렇구나!', '재밌다', '히히'][Math.floor(Math.random()*4)]); }, 900);
  });
  var running = {};
  StageRT.onMatch(function (m, key) {                                                 // 씨름: 수락되면 대결 시작, 점수 반영
    if (m.status === 'go' && !running[key] && E.sceneName() !== 'duel') {
      running[key] = true;
      var started = E.duel(m.a, m.b, { duration: 8, onEnd: function (winner, sa, sb) { StageRT.setMatch(key, { status: 'done', winner: winner, sa: sa, sb: sb }); } });
      if (!started) StageRT.setMatch(key, { status: 'cancel' });
    }
    if (m.status === 'go' && m.score) E.duelScores(m.score[m.a] || 0, m.score[m.b] || 0);
  });
});
var rtMode = 'local';
var online = false;
StageServer.init('stage', { onOnline: function () { online = true; }, onOffline: function () { online = false; } });
setInterval(function () { var t = tag.textContent.replace(/( · (서버|같은 기기|실시간))+$/, ''); tag.textContent = t + ' · ' + (online ? '서버' : '같은 기기') + (rtMode === 'firebase' ? ' · 실시간' : ''); }, 3000);

/* 개발용 조작판: ?dev=1 */
if (/[?&]dev=1/.test(location.search)) {
  document.getElementById('dev').classList.add('on');
  document.querySelectorAll('#dev [data-w]').forEach(function (b) { b.onclick = function () { E.setWorld(b.dataset.w); }; });
  document.getElementById('dFriend').onclick = E.friends; document.getElementById('dSsireum').onclick = E.tournament; document.getElementById('dDance').onclick = E.dance;
  document.getElementById('dClear').onclick = E.clear;
  document.getElementById('dRig').onclick = addRigSamples;
  document.getElementById('dDemo').onclick = function () { StageBus.send({ type: 'demo' }); StageDemos.all(function (im, cat, desc) { E.add(E.cutout(im, 512), { seat: Math.ceil(Math.random()*15), nick: StageDemos.NICKS[Math.floor(Math.random()*12)], cat: cat, desc: desc }); }); };
  /* 아이가 그린 배경 흉내: 크레용 느낌의 '화산섬과 바다' (물·땅·하늘) */
  document.getElementById('dWorld').onclick = function () {
    var cv = document.createElement('canvas'); cv.width = 1280; cv.height = 720; var c = cv.getContext('2d');
    c.fillStyle = '#ffd9a0'; c.fillRect(0, 0, 1280, 360); c.fillStyle = '#ff8c42'; c.beginPath(); c.arc(1000, 120, 70, 0, 6.3); c.fill();
    c.fillStyle = '#7a4b2a'; c.beginPath(); c.moveTo(200, 360); c.lineTo(520, 90); c.lineTo(840, 360); c.fill(); c.fillStyle = '#ff3b1f'; c.beginPath(); c.moveTo(480, 120); c.lineTo(520, 60); c.lineTo(560, 120); c.fill();
    c.fillStyle = '#4cc3e8'; c.fillRect(0, 360, 1280, 260); c.fillStyle = '#e8d28a'; c.fillRect(0, 620, 1280, 100);
    c.strokeStyle = '#333'; c.lineWidth = 6; c.strokeRect(3, 3, 1274, 714);
    E.defineWorld('kid1', { name: '7번 번개상어의 화산섬', kind: 'all', band: { surface: 0.5, bottom: 0.86 }, desc: '용암이 흐르는 화산섬과 바다', img: cv });
    E.setWorld('kid1');
  };
}
</script>
</body>
</html>
